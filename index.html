<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vortex Script Host</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, sans-serif; background:#0b0b0f; color:#eee; }
    card { background:#15151c; border:1px solid #2a2a35; border-radius:16px;
      padding:2rem; max-width:520px; }
    code { background:#0b0b0f; padding:.35rem .5rem; border-radius:6px;
      color:#ffc43a; display:block; margin-top:1rem; word-break:break-all; font-size:13px; }
    h1 { margin:0 0 .5rem; font-size:1.25rem; }
    p { opacity:.75; line-height:1.5; }
  </style>
</head>
<body>
  <card>
    <h1>Vortex · Vercel Host</h1>
    <p>Usa el loader en tu executor. No abras <code>/api/script</code> en el navegador.</p>
    <code id="loader">loadstring(game:HttpGet("https://Vortex-x-software.vercel.app/api/loader"))()</code>
  </card>
  <script>
    const host = location.origin;
    document.getElementById("loader").textContent =
      `loadstring(game:HttpGet("${host}/api/loader"))()`;
  </script>
</body>
</html>
